<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi | COMIC 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<style>
/* Gaya sama seperti login.html */
.auth-section { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:140px 5% 80px; }
.auth-panel { width:100%; max-width:500px; background:linear-gradient(160deg,rgba(35,45,56,0.92),rgba(22,29,36,0.88)); border:1px solid var(--line-strong); border-radius:6px; padding:48px 40px 42px; backdrop-filter:blur(18px); box-shadow:0 26px 70px rgba(0,0,0,0.65),0 0 50px rgba(156,126,80,0.12); position:relative; }
.auth-panel::before { content:""; position:absolute; top:0; left:10%; right:10%; height:1px; background:linear-gradient(90deg,transparent,var(--brass-bright),transparent); opacity:0.7; }
.auth-panel .auth-eyebrow { font-family:var(--font-mono); font-size:10px; letter-spacing:5px; color:var(--brass); text-align:center; margin-bottom:10px; opacity:0.85; }
.auth-panel h2 { font-family:var(--font-display); font-size:28px; letter-spacing:3px; color:var(--parchment); text-align:center; margin-bottom:8px; }
.auth-panel h2::before, .auth-panel h2::after { display:none; }
.auth-sub { text-align:center; font-style:italic; color:var(--ink-soft); font-size:15px; margin-bottom:32px; }
.form-group { margin-bottom:22px; position:relative; }
.form-group label { display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--brass); margin-bottom:8px; }
.form-group input, .form-group select { width:100%; padding:14px 16px; background:rgba(14,19,24,0.7); border:1px solid var(--line); border-radius:3px; color:var(--parchment); font-family:var(--font-body); font-size:16px; transition:border-color .35s, box-shadow .35s; }
.form-group input:focus, .form-group select:focus { outline:none; border-color:var(--brass); box-shadow:0 0 0 2px rgba(196,168,120,0.2),0 0 20px rgba(156,126,80,0.15); }
.form-group input::placeholder { color:var(--ink-dim); font-style:italic; }
.form-group select option { background:#1e2730; color:var(--parchment); }
.auth-btn { width:100%; padding:15px; background:linear-gradient(135deg,var(--brass) 0%,var(--brass-bright) 50%,var(--brass) 100%); background-size:200% 100%; border:none; border-radius:3px; color:#1a1208; font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:3.5px; text-transform:uppercase; cursor:none; transition:transform .4s,box-shadow .4s; animation:btnShine 6s linear infinite; }
.auth-btn:hover { transform:translateY(-3px); box-shadow:0 12px 36px rgba(196,168,120,0.5); }
.auth-footer { text-align:center; margin-top:26px; font-size:15px; color:var(--ink-soft); }
.auth-footer a { color:var(--brass-bright); text-decoration:none; font-weight:600; transition:text-shadow .3s; }
.auth-footer a:hover { text-shadow:0 0 14px rgba(196,168,120,0.7); }
.auth-message { padding:12px 16px; border-radius:3px; margin-bottom:20px; font-size:14px; display:none; }
.auth-message.error { display:block; background:rgba(180,60,60,0.15); border:1px solid rgba(180,60,60,0.5); color:#e8a0a0; }
.auth-message.success { display:block; background:rgba(90,122,106,0.15); border:1px solid rgba(90,122,106,0.5); color:#a0d4b8; }
</style>
</head>
<body>

<div id="bg-layer" aria-hidden="true">
  <div class="bg-gradient"></div><div class="bg-vignette"></div>
  <svg class="bg-atom" viewBox="0 0 600 600"><g fill="none" stroke="currentColor" stroke-width="1.1"><ellipse cx="300" cy="300" rx="80" ry="240"/><ellipse cx="300" cy="300" rx="80" ry="240" transform="rotate(60 300 300)"/><ellipse cx="300" cy="300" rx="80" ry="240" transform="rotate(120 300 300)"/><circle cx="300" cy="300" r="14" fill="currentColor" fill-opacity="0.22"/><circle cx="300" cy="300" r="6" fill="currentColor"/></g></svg>
  <svg class="bg-gear gear-1" viewBox="0 0 200 200"><g fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="50"/><circle cx="100" cy="100" r="18"/></g></svg>
  <svg class="bg-gear gear-2" viewBox="0 0 200 200"><g fill="none" stroke="currentColor" stroke-width="1"><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="56"/><circle cx="100" cy="100" r="22"/></g></svg>
</div>
<div id="leaf-layer" aria-hidden="true"></div>
<div class="quill-cursor" id="quillCursor" aria-hidden="true">🪶</div>

<div class="topbar" id="topbar">
  <div class="logo"><span class="logo-mark">⚛</span><span class="logo-text">COMIC <em>2026</em></span></div>
  <div class="topbar-right"><a href="index.html" class="btn btn-ghost" style="padding:8px 18px;font-size:11px;">Beranda</a></div>
</div>

<section class="auth-section">
  <div class="auth-panel">
    <div class="auth-eyebrow">— INSCRIPTIO CODEX —</div>
    <h2>Registrasi</h2>
    <p class="auth-sub">Buat akun untuk mengikuti COMIC 2026</p>

    <div class="auth-message" id="authMessage"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="regName">Nama Lengkap</label>
        <input type="text" id="regName" placeholder="Nama lengkap" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="nama@email.com" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="Minimal 6 karakter" required minlength="6">
      </div>
      <div class="form-group">
        <label for="regSchool">Asal Sekolah</label>
        <input type="text" id="regSchool" placeholder="Nama sekolah" required>
      </div>
      <div class="form-group">
        <label for="regLevel">Jenjang</label>
        <select id="regLevel" required>
          <option value="">-- Pilih Jenjang --</option>
          <option value="TK/RA">TK/RA</option>
          <option value="SD/MI">SD/MI</option>
          <option value="SMP/MTs">SMP/MTs</option>
          <option value="SMA/MA">SMA/MA</option>
          <option value="Umum">Umum</option>
        </select>
      </div>
      <button type="submit" class="auth-btn">Daftar</button>
    </form>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>
  </div>
</section>

<script src="script.js"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
</body>
</html>
